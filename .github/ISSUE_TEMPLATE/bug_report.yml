name: Bug report
description: Report a reproducible problem using fictional data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please use fictional examples. Never include tokens, passwords, bank details, or personal records. Report security issues privately through the Security tab.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page and actions needed to reproduce it with demo data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, Chrome on Windows, etc.
